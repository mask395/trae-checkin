name: Trae 每日签到

# 每天 UTC 01:10（北京时间 09:10）自动运行；Actions 高峰期可能延迟
# workflow_dispatch：允许在 Actions 页面手动触发，便于部署后立即验证
on:
  schedule:
    - cron: "10 1 * * *"
  workflow_dispatch:

# 同一时刻只允许一个签到任务，手动触发与定时任务不重叠运行
concurrency:
  group: trae-checkin
  cancel-in-progress: false

# 只读权限，最小化工作流令牌权限
permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 从 Secrets 还原账号凭证
        shell: bash
        env:
          TRAE_ACCOUNTS: ${{ secrets.TRAE_ACCOUNTS }}
        run: |
          mkdir -p accounts
          if [ -z "$TRAE_ACCOUNTS" ]; then
            echo "::error::未配置 TRAE_ACCOUNTS。请在仓库 Settings → Secrets and variables → Actions 添加，格式：名称=Base64;名称=Base64"
            exit 1
          fi
          count=0
          # Secret 格式：名称=Base64;名称=Base64（账号名勿含 = 与 ;，建议用英文/拼音）
          OLDIFS="$IFS"; IFS=';'
          for entry in $TRAE_ACCOUNTS; do
            [ -z "$entry" ] && continue
            name="${entry%%=*}"
            value="${entry#*=}"
            if [ -z "$name" ] || [ -z "$value" ]; then
              echo "::warning::跳过格式错误的条目: $entry（应为 名称=Base64）"
              continue
            fi
            mkdir -p "accounts/$name"
            printf '%s' "$value" | base64 -d > "accounts/$name/storage.json"
            echo "已还原账号: $name"
            count=$((count + 1))
          done
          IFS="$OLDIFS"
          if [ "$count" -eq 0 ]; then
            echo "::error::TRAE_ACCOUNTS 中没有有效条目，格式应为：名称=Base64;名称=Base64"
            exit 1
          fi

      - name: 批量签到（失败自动重试 3 次）
        shell: bash
        run: |
          ok=0
          for i in 1 2 3; do
            if node scripts/checkin-all.js; then ok=1; break; fi
            echo "第 $i 次运行失败，20 秒后重试..."
            sleep 20
          done
          [ "$ok" = "1" ]
