name: Trae 每日签到

# 每天 UTC 00:00（北京时间 08:00）自动运行；Actions 高峰期可能延迟
# workflow_dispatch：允许在 Actions 页面手动触发，便于部署后立即验证
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# 同一时刻只允许一个签到任务，手动触发与定时任务不重叠运行
concurrency:
  group: trae-checkin
  cancel-in-progress: false

# 只读权限，最小化工作流令牌权限
permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 把 Secret 原文写入引导文件（不再解码到 accounts/ 目录；解析与合并由脚本完成）
      - name: 写入引导账号文件
        shell: bash
        env:
          TRAE_ACCOUNTS: ${{ secrets.TRAE_ACCOUNTS }}
        run: |
          if [ -z "$TRAE_ACCOUNTS" ]; then
            echo "::error::未配置 TRAE_ACCOUNTS。请在仓库 Settings → Secrets and variables → Actions 添加，格式：名称=Base64;名称=Base64"
            exit 1
          fi
          printf '%s' "$TRAE_ACCOUNTS" > "$RUNNER_TEMP/bootstrap.txt"
          echo "引导账号文件已写入（${#TRAE_ACCOUNTS} 字符）"

      # 恢复上次运行持久化的会话（含刷新轮换后的新令牌）；
      # key 按 run_id 唯一，restore-keys 回退到最近一次 v1 缓存
      - name: 恢复历史会话（Actions Cache）
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .state/state.txt
          key: trae-sessions-v1-${{ github.run_id }}
          restore-keys: |
            trae-sessions-v1-

      # 云端模式三环境变量：引导(Secret) + 状态(Cache) → 合并签到 → 输出新状态
      - name: 批量签到（失败自动重试 3 次）
        shell: bash
        env:
          TRAE_BOOTSTRAP_FILE: ${{ runner.temp }}/bootstrap.txt
          TRAE_STATE_FILE: .state/state.txt
          TRAE_STATE_OUT: .state/state.txt
        run: |
          mkdir -p .state
          ok=0
          for i in 1 2 3; do
            if node scripts/checkin-all.js; then ok=1; break; fi
            echo "第 $i 次运行失败，20 秒后重试..."
            sleep 20
          done
          [ "$ok" = "1" ]

      # 即使本次运行失败也保存状态（成功刷新过的账号令牌已轮换，必须留存，否则明天双重失效）
      - name: 持久化本次会话（Actions Cache）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state/state.txt
          key: trae-sessions-v1-${{ github.run_id }}
