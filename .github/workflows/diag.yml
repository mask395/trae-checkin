name: Trae 诊断（临时）

on:
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 引导文件
        if: ${{ env.TRAE_ACCOUNTS != '' }}
        env:
          TRAE_ACCOUNTS: ${{ secrets.TRAE_ACCOUNTS }}
        run: |
          printf '%s' "$TRAE_ACCOUNTS" > "$RUNNER_TEMP/bootstrap.txt"
      - uses: actions/cache/restore@v4
        with:
          path: .state/state.txt
          key: trae-sessions-v1-${{ github.run_id }}
          restore-keys: trae-sessions-v1-
          fail-on-cache-miss: false
      - name: 云端诊断
        env:
          TRAE_BOOTSTRAP_FILE: /home/runner/work/_temp/bootstrap.txt
          TRAE_STATE_FILE: .state/state.txt
        run: node scripts/diag-cloud.js
